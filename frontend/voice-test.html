<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bob Voice Test</title>
</head>

<body>
    <h2>Bob Microphone Test</h2>

    <button id="start">Start Microphone</button>
    <button id="stop" disabled>Stop</button>

    <p id="status">Waiting...</p>

    <script>
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const status = document.getElementById("status");

        let stream;

        startButton.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                status.textContent = "🎤 Microphone is working!";
                startButton.disabled = true;
                stopButton.disabled = false;

                console.log("Microphone stream:", stream);

            } catch (error) {
                console.error(error);
                status.textContent =
                    "❌ Microphone error: " + error.message;
            }
        };

        stopButton.onclick = () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            status.textContent = "Microphone stopped.";
            startButton.disabled = false;
            stopButton.disabled = true;
        };
    </script>
</body>
</html>
